name: Java Maven Tests

on:
  push:
    branches:
      - main    # Run tests on pushes to the 'main' branch
  pull_request:
    branches:
      - main    # Run tests on pull requests to 'main'

jobs:
  test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up JDK 23
      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          java-version: '23'
          distribution: 'zulu'  # Use Zulu OpenJDK distribution
          cache: maven  # Enable caching for Maven dependencies

      # Step 3: Verify Maven Installation
      - name: Verify Maven
        run: mvn -v

      # Step 4: Run Maven tests
      - name: Run tests
        run: mvn clean test
